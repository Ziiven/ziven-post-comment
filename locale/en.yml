ziven-post-comment:
  forum:
    post:
      reply_link: Reply
      # v0.1.0d: separate key for the per-post "Reply" button inside
      # NestedReplies (it toggles the inline composer, while
      # `reply_link` is the link on the parent post that scrolls +
      # triggers the same toggle).
      reply: Reply
      view_more_replies: "View {count, plural, one {# more reply} other {# more replies}}"
      # v0.1.0e.b: 辉哥 20:49 拍板的 "展示更多" 按钮.
      # Matches 小黑盒 UX: a plain "Show more" button without a
      # count. 3 by default + 10 per click.
      load_more_replies: Show more
      collapse_replies: Collapse
      composer_placeholder: Write a reply…
      composer_submit: Post Reply
    composer:
      # v0.1.0e.a: NestedReplyComposer title
      reply_to: "Reply to @{username}"
    settings:
      notify_post_commented_label: "Someone replies to my post"
  admin:
    settings:
      heading: "Ziven Post Comment"
      description: "Single-level nested replies for top-level comments. Replies can themselves receive likes and mentions, but cannot be replied to again (single-level only — like WeChat Moments / XiaoHeiHe / Zhihu / Weibo)."
  lib:
    notification:
      post_commented_text: "{username} replied to your post"
