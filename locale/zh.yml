ziven-post-comment:
  forum:
    post:
      reply_link: 回复
      # v0.1.0d: NestedReplies 内的 "Reply" 按钮 (跟 Post 级别的
      # `reply_link` 区分, 功能相同都是 toggle 内联 composer)
      reply: 回复
      # v0.1.0e.a: "查看更多 {count} 条回复" 按钮 (显示 3 之后
      # 剩下的 reply 数).
      # v0.1.0e.b: 改成 "展示更多" (辉哥 20:49 拍板, 小黑盒
      # 风格, 不带 count 数字). `view_more_replies` 保留以备
      # 旧版兼容 — 如果以后有别的 view 还要用 count 形式.
      view_more_replies: "查看更多 {count} 条回复"
      # v0.1.0e.b: 辉哥 20:49 拍板的 "展示更多" 按钮文案.
      load_more_replies: 展示更多
      collapse_replies: 收起
      composer_placeholder: 写一条回复…
      composer_submit: 发表回复
    composer:
      # v0.1.0e.a: NestedReplyComposer 的 title
      reply_to: "回复 @{username}"
    settings:
      notify_post_commented_label: "有人回复了我的帖子"
  admin:
    settings:
      heading: "Ziven 楼中楼回复"
      description: "为顶层评论启用单层楼中楼回复。回复可以点赞、被 @，但不能再被回复（单层限制 — 仿微信朋友圈/小黑盒/知乎/微博）。"
  lib:
    notification:
      post_commented_text: "{username} 回复了你的帖子"
